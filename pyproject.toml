[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sara-risk-detection"
version = "1.0.0"
description = "Risk-aware account detection for agent social platforms"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "numpy>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "tldextract>=5.1",
  "torch>=2.5"
]

[tool.setuptools.packages.find]
include = ["sara*", "multisource*", "comment_network*", "offline_8b*"]
